apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pico-placa-app
  namespace: argocd
spec:
  project: default

  # Source del repositorio Git
  source:
    repoURL: https://github.com/RicardoVaca109/PicoandPlacaCalculator.git
    targetRevision: HEAD
    path: k8s

  # Destino en el cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: default

  # Sincronización automática
  syncPolicy:
    automated:
      prune: true # Eliminar recursos que ya no están en Git
      selfHeal: true # Sincronizar automáticamente si hay cambios manuales
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
