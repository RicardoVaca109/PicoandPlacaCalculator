apiVersion: apps/v1
kind: Deployment
metadata:
  name: pico-placa-app
  labels:
    app: pico-placa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pico-placa
  template:
    metadata:
      labels:
        app: pico-placa
    spec:
      containers:
        - name: pico-placa
          image: python:3.11-slim
          command: ["/bin/sh"]
          args:
            - -c
            - |
              apt-get update && apt-get install -y git
              git clone https://github.com/RicardoVaca109/PicoandPlacaCalculator.git /app
              cd /app
              pip install --no-cache-dir -r requirements.txt
              python app.py
          ports:
            - containerPort: 5000
          env:
            - name: LAUNCHDARKLY_SDK_KEY
              valueFrom:
                secretKeyRef:
                  name: launchdarkly-secret
                  key: sdk-key
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 100
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
