apiVersion: apps/v1
kind: Deployment
metadata:
  name: pico-placa-app
  labels:
    app: pico-placa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pico-placa
  template:
    metadata:
      labels:
        app: pico-placa
    spec:
      containers:
        - name: pico-placa
          image: ricardo109/pico-placa-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: LAUNCHDARKLY_SDK_KEY
              valueFrom:
                secretKeyRef:
                  name: launchdarkly-secret
                  key: sdk-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
