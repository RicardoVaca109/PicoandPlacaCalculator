version: 2.1

orbs:
  python: circleci/python@2.1.1

jobs:
  # 1️⃣ Lint del código
  lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Setup Python Environment
          command: |
            python -m venv .venv
            . .venv/bin/activate
            pip install --upgrade pip
            pip install flake8 -r requirements.txt
      - run:
          name: Run flake8
          command: |
            . .venv/bin/activate
            flake8 .

  # 2️⃣ Tests unitarios (con paralelismo)
  unit-tests:
    docker:
      - image: cimg/python:3.12
    parallelism: 2
    steps:
      - checkout
      - run:
          name: Setup Python Environment
          command: |
            python -m venv .venv
            . .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Run Unit Tests
          command: |
            mkdir -p reports
            . .venv/bin/activate
            export PYTHONPATH=$(pwd)
            pytest --maxfail=1 --disable-warnings --junitxml=reports/junit.xml
      - store_artifacts:
          path: reports
          destination: test-results

  # 3️⃣ Build
  build:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Build App
          command: |
            echo "Build completado exitosamente."

  # 4️⃣ Notificación a Discord
  notify-discord:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Send Discord Notification
          when: always
          command: |
            echo "Determinando estado del workflow..."
            if [ "$CIRCLE_WORKFLOW_STATUS" = "success" ]; then
              STATUS="SUCCESSFUL"
              COLOR=65280  # Verde
            else
              STATUS="ABORTED"
              COLOR=16711680  # Rojo
            fi

            MESSAGE="**Proyecto:** ${CIRCLE_PROJECT_REPONAME}\n**Workflow:** ${CIRCLE_WORKFLOW_ID}\n**Estado:** ${STATUS}\n**Repositorio:** ${CIRCLE_REPOSITORY_URL}\n**Rama:** ${CIRCLE_BRANCH}\n**Build URL:** ${CIRCLE_BUILD_URL}"

            echo "Enviando notificación a Discord..."
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d "{\"embeds\":[{\"title\":\"${CIRCLE_PROJECT_REPONAME}\",\"description\":\"${MESSAGE}\",\"color\":${COLOR}}]}" \
                 $DISCORD_WEBHOOK_URL

# 🧩 Workflows: uno para la ejecución principal, otro para la notificación
workflows:
  version: 2

  # Primer workflow → Build principal
  build_and_test:
    jobs:
      - lint
      - unit-tests:
          requires:
            - lint
      - build:
          requires:
            - unit-tests

  # Segundo workflow → Notificación (se ejecuta siempre, independiente)
  notify:
    jobs:
      - notify-discord:
          context: discord-webhook
