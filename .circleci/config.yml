version: 2.1

orbs:
  python: circleci/python@2.1.1

jobs:
  lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Lint code with flake8
          command: |
            python -m venv .venv
            . .venv/bin/activate
            pip install --upgrade pip
            pip install flake8
            flake8 .
      - run:
          name: Save lint result
          command: echo "SUCCESSFUL" > result.txt
      - persist_to_workspace:
          root: .
          paths:
            - result.txt

  unit-tests:
    docker:
      - image: cimg/python:3.12
    parallelism: 2
    steps:
      - checkout
      - run:
          name: Run unit tests
          command: |
            python -m venv .venv
            . .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            pytest --maxfail=1 --disable-warnings --junitxml=reports/junit.xml || echo "FAILED" > result.txt
      - run:
          name: Save unit test result
          command: |
            if [ ! -f result.txt ]; then echo "SUCCESSFUL" > result.txt; fi
      - persist_to_workspace:
          root: .
          paths:
            - result.txt
            - reports
      - store_artifacts:
          path: reports
          destination: test-results

  build:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Build project
          command: |
            echo "Build completado exitosamente."
            echo "SUCCESSFUL" > result.txt
      - persist_to_workspace:
          root: .
          paths:
            - result.txt

  notify-discord:
    docker:
      - image: cimg/python:3.12
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Determine final status
          command: |
            # Si algún resultado previo falló, se marca como ABORTED
            if grep -q "FAILED" result.txt 2>/dev/null; then
              echo "ABORTED" > final_status.txt
            else
              echo "SUCCESSFUL" > final_status.txt
            fi
      - run:
          name: Send Discord Notification
          when: always
          command: |
            STATUS=$(cat final_status.txt || echo "ABORTED")
            if [ "$STATUS" = "SUCCESSFUL" ]; then
              COLOR=65280
            else
              COLOR=16711680
            fi

            MESSAGE="**Proyecto:** ${CIRCLE_PROJECT_REPONAME}\n**Build:** #${CIRCLE_BUILD_NUM}\n**Estado:** ${STATUS}\n**Repositorio:** ${CIRCLE_REPOSITORY_URL}\n**Rama:** ${CIRCLE_BRANCH}\n**Build URL:** ${CIRCLE_BUILD_URL}"

            echo "Enviando notificación a Discord..."
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d "{\"embeds\":[{\"title\":\"${CIRCLE_PROJECT_REPONAME}\",\"description\":\"${MESSAGE}\",\"color\":${COLOR}}]}" \
                 $DISCORD_WEBHOOK_URL

workflows:
  version: 2

  # Primer workflow: build y pruebas
  build_and_test:
    jobs:
      - lint
      - unit-tests:
          requires:
            - lint
      - build:
          requires:
            - unit-tests

  # Segundo workflow: notificación
  notify:
    triggers:
      - schedule:
          cron: "0 * * * *"  # Se ejecuta automáticamente cada hora (puedes cambiarlo)
          filters:
            branches:
              only:
                - main
    jobs:
      - notify-discord
