version: 2.1

orbs:
  python: circleci/python@2.1.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
    environment:
      APP_NAME: "PicoandPlacaCalculator"
      REMOTE_USER: "ricardo_vaca"
      REMOTE_HOST: "localhost"
      REMOTE_PATH: "C:\\Users\\ricardo_vaca\\app"
      GIT_URL: "https://github.com/RicardoVaca109/PicoandPlacaCalculator.git"

    steps:
      - checkout

      - run:
          name: Setup Python Environment
          command: |
            python -m venv .venv
            . .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

      - run:
          name: Lint with flake8
          command: |
            . .venv/bin/activate
            pip install flake8
            flake8 .

      - run:
          name: Run Unit Tests
          command: |
            mkdir -p reports
            . .venv/bin/activate
            export PYTHONPATH=$(pwd)
            pytest --maxfail=1 --disable-warnings --junitxml=reports/junit.xml

      - run:
          name: Build
          command: |
            echo "Build completado exitosamente."

      - run:
          name: Fetch All Branches
          command: |
            git fetch --all

      - store_artifacts:
          path: reports
          destination: test-results

      - run:
          name: Send Discord Notification
          when: always
          command: |
            if [ "${CIRCLE_JOB_STATUS}" = "success" ]; then
              COLOR=65280
            else
              COLOR=16711680
            fi

            MESSAGE="**Proyecto:** ${CIRCLE_PROJECT_REPONAME}\n**Build:** #${CIRCLE_BUILD_NUM}\n**Estado:** ${CIRCLE_JOB_STATUS}\n**Repositorio:** ${CIRCLE_REPOSITORY_URL}\n**Rama:** ${CIRCLE_BRANCH}\n**Build URL:** ${CIRCLE_BUILD_URL}"

            echo "Enviando notificación a Discord..."
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d "{\"embeds\":[{\"title\":\"${CIRCLE_PROJECT_REPONAME}\",\"description\":\"${MESSAGE}\",\"color\":${COLOR}}]}" \
                 $DISCORD_WEBHOOK_URL

workflows:
  version: 2
  build_and_test:
    jobs:
      - build-and-test:
          context: discord-webhook
